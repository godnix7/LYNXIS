version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lynxis-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-lynxis_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lynxis_password}
      POSTGRES_DB: ${DB_NAME:-lynxis_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lynxis-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lynxis-api
    restart: always
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-lynxis_user}:${DB_PASSWORD:-lynxis_password}@db:5432/${DB_NAME:-lynxis_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-lynxis_jwt_secret}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5174}
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
